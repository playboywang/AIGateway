[project]
name = "aigateway"
version = "0.1.0"
description = "A multi-tenant AI API gateway."
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
